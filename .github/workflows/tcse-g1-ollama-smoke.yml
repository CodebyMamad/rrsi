name: TCSE G1 flexible local-model smoke
on:
  push:
    branches: ["tcse/provider-flex-2026-11-15"]
    paths: [".github/workflows/tcse-g1-ollama-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tcse-g1-ollama
  cancel-in-progress: false
jobs:
  harbor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RRSI_POLICY_MODEL: ollama_chat/qwen2.5-coder:1.5b
      RRSI_POLICY_API_BASE: http://127.0.0.1:11434
      RRSI_POLICY_MAX_TURNS: "12"
      RRSI_SEARCH_BACKEND: litellm
      RRSI_SEARCH_MODEL: ollama_chat/qwen2.5-coder:1.5b
      RRSI_SEARCH_API_BASE: http://127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify checkout, original tests, provider tests
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          python -m pip install -e '.[dev]'
          python -m pytest -q tests
      - name: Verify Docker and install authentic Harbor environment
        shell: bash
        run: |
          set -euxo pipefail
          docker version
          docker info --format 'Docker server={{.ServerVersion}} driver={{.Driver}}'
          python -m venv domains/coding/.venv
          domains/coding/.venv/bin/python -m pip install --upgrade pip
          domains/coding/.venv/bin/pip install 'harbor>=0.18'
          domains/coding/.venv/bin/harbor --help >/dev/null
          domains/coding/.venv/bin/python -c 'from harbor_terminus2 import AgentHarness; print(AgentHarness.name())' || true
      - name: Start free local model in Docker
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name tcse-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 ollama/ollama:latest
          for i in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl --fail http://127.0.0.1:11434/api/tags
          docker exec tcse-ollama ollama pull qwen2.5-coder:1.5b
          docker image inspect ollama/ollama:latest --format 'Ollama image={{index .RepoDigests 0}}' || true
          docker exec tcse-ollama ollama list
      - name: Verify model endpoint without secrets
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --max-time 180 http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5-coder:1.5b","messages":[{"role":"user","content":"Reply OK."}],"max_tokens":16}' \
            | python -c 'import json,sys; obj=json.load(sys.stdin); print("MODEL_PROBE_OK", bool(obj["choices"][0]["message"]["content"]))'
      - name: G1 — two authentic Harbor tasks, local model substituted
        shell: bash
        run: |
          set -euxo pipefail
          echo "G1 MODEL-SWAPPED smoke: extract-elf and fix-git, k=1, not original-paper reproduction."
          echo "Policy: $RRSI_POLICY_MODEL ; search: $RRSI_SEARCH_MODEL"
          timeout --signal=TERM --kill-after=20s 1500s python rrsi.py --domain coding smoke
      - name: Record version and trial receipt
        if: always()
        shell: bash
        run: |
          mkdir -p tcse_g1_receipts
          python -V > tcse_g1_receipts/versions.txt
          git rev-parse HEAD >> tcse_g1_receipts/versions.txt
          git status --short >> tcse_g1_receipts/versions.txt
          docker version >> tcse_g1_receipts/versions.txt 2>&1 || true
          domains/coding/.venv/bin/pip show harbor | head -n 12 >> tcse_g1_receipts/versions.txt || true
          docker ps -a >> tcse_g1_receipts/versions.txt || true
          find runs/coding -name result.json -type f -print 2>/dev/null | sort > tcse_g1_receipts/result_paths.txt || true
          docker logs tcse-ollama --tail 100 > tcse_g1_receipts/ollama.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcse-g1-local-model-smoke
          if-no-files-found: warn
          retention-days: 14
          path: |
            tcse_g1_receipts/
            runs/coding/logs/
            runs/coding/jobs/smoke/
