name: TCSE G1 D6 host-owned postcondition offline gate
on:
  push:
    branches: ["tcse/g1-host-postcondition-2026-11-15"]
    paths:
      - ".github/workflows/tcse-g1-d6-host-probe.yml"
      - "third_party/harbor_terminus2/host_file_probe.py"
      - "tests/test_g1_host_file_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install baseline and pinned Harbor
        run: |
          python -m pip install -e '.[dev]' 'harbor==0.26.0'
      - name: D6 plus all prior regression tests (no model or benchmark)
        env:
          PYTHONPATH: third_party
        run: |
          python -m pytest -q tests
          python -m compileall -q third_party/harbor_terminus2
          bash -n domains/coding/scripts/run_eval.sh
