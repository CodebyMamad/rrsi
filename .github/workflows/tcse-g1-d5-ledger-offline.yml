name: TCSE G1 D5 action-effect ledger offline gate
on:
  push:
    branches: ["tcse/g1-evidence-ledger-2026-11-15"]
    paths:
      - ".github/workflows/tcse-g1-d5-ledger-offline.yml"
      - "third_party/harbor_terminus2/evidence_ledger.py"
      - "tests/test_g1_evidence_ledger.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install baseline and pinned Harbor used for D4
        run: |
          python -m pip install -e '.[dev]' 'harbor==0.26.0'
      - name: Verify regression suite and D5 impossibility cases
        env:
          PYTHONPATH: third_party
        run: |
          python -m pytest -q tests
          python -m compileall -q third_party/harbor_terminus2
          bash -n domains/coding/scripts/run_eval.sh
