name: TCSE D2.1 local JSON contract diagnostic
on:
  push:
    branches: ["tcse/g1-d21-format-2026-11-15"]
    paths: [".github/workflows/tcse-g1-d21-format.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tcse-g1-d21-contract
  cancel-in-progress: false
jobs:
  synthetic-d21:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      PYTHONUNBUFFERED: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original and D2.1 tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests
          python -m py_compile scripts/tcse_g1_d21_format.py
      - name: Start pinned free local model in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker run -d --name tcse-d21-ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -e OLLAMA_CONTEXT_LENGTH=8192 \
            ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec tcse-d21-ollama ollama pull qwen2.5-coder:1.5b
          docker exec tcse-d21-ollama ollama list
      - name: Twelve synthetic-only calls (four fixed prompts, three modes)
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=15s 780s \
            python scripts/tcse_g1_d21_format.py --output tcse_d21_receipts/results.json
      - name: Preserve run evidence
        if: always()
        shell: bash
        run: |
          mkdir -p tcse_d21_receipts
          git rev-parse HEAD > tcse_d21_receipts/versions.txt
          python -V >> tcse_d21_receipts/versions.txt
          sha256sum scripts/tcse_g1_d21_format.py >> tcse_d21_receipts/versions.txt
          docker exec tcse-d21-ollama ollama list >> tcse_d21_receipts/versions.txt 2>&1 || true
          docker logs tcse-d21-ollama --tail 60 > tcse_d21_receipts/ollama_tail.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcse-d21-json-contract-receipts
          retention-days: 14
          path: tcse_d21_receipts/
