name: TCSE RRSI provider-flex (offline)
on:
  push:
    branches:
      - "tcse/provider-flex-2026-11-15"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider-neutral core and tests
        run: python -m pip install -e '.[dev]'
      - name: Run original and provider-flex tests
        run: python -m pytest -q tests
      - name: Check shell runner syntax
        run: |
          bash -n domains/coding/scripts/run_eval.sh
          sh -n domains/coding/bin/docker
